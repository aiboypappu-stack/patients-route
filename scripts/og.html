<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:M;font-weight:400;src:url(../site/fonts/mukta-400.woff2)}
@font-face{font-family:M;font-weight:700;src:url(../site/fonts/mukta-700.woff2)}
@font-face{font-family:Tiro;src:url(../site/fonts/tiro-400.woff2)}
html,body{margin:0}
body{width:1200px;height:630px;background:#F6EEE1;color:#22190D;font-family:M;box-sizing:border-box;padding:64px 80px;position:relative;overflow:hidden}
h1{font-family:Tiro;font-weight:400;font-size:104px;line-height:1.25;margin:0}
h2{font-family:Tiro;font-weight:400;font-size:52px;color:#5C5145;margin:0 0 30px}
p{font-size:46px;font-weight:700;margin:0;line-height:1.4}
.bar{position:absolute;left:80px;right:80px;bottom:120px;height:26px;border-radius:13px;display:flex;overflow:hidden}
.bar span{height:100%}
.m{position:absolute;bottom:108px;left:calc(80px + (1040px * 0.25) - 4px);width:8px;height:50px;background:#D4502A;border-radius:4px}
.m:after{content:"";position:absolute;left:-11px;top:-26px;width:30px;height:30px;border-radius:50%;background:#D4502A;border:5px solid #F6EEE1}
.t{position:absolute;bottom:58px;height:40px;left:80px;right:80px;font-size:28px;color:#5C5145;font-weight:700}
.t span{position:absolute}
.brand{position:absolute;right:80px;top:70px;font-size:28px;font-weight:700;color:#B8431F}
</style></head><body>
<div class="brand">Beyond Metros</div>
<h1>मरीज़ का रास्ता</h1>
<h2>The Patient's Route</h2>
<p>रात में हार्ट अटैक, शहर से 80 किलोमीटर दूर।</p>
<div class="bar"><span style="width:12.5%;background:#EFE5D3"></span><span style="width:12.5%;background:#F2DCC4"></span><span style="width:12.5%;background:#F2D0B4"></span><span style="width:37.5%;background:#EEC3A2"></span><span style="width:25%;background:#E8B592"></span></div>
<div class="m"></div>
<div class="t"><span style="left:0">0 h</span><span style="left:25%;transform:translateX(-50%)">2 h</span><span style="right:0">8 h</span></div>
</body></html>
